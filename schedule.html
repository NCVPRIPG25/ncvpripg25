<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tabbed PDF Viewer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }

    /* Tabs styling */
    .tab {
      overflow: hidden;
      border-bottom: 1px solid #ccc;
      margin-bottom: 10px;
    }

    .tab button {
      background-color: #f1f1f1;
      float: left;
      border: none;
      outline: none;
      cursor: pointer;
      padding: 14px 16px;
      transition: background-color 0.3s;
      font-size: 17px;
    }

    .tab button:hover {
      background-color: #ddd;
    }

    .tab button.active {
      background-color: #ccc;
    }

    .tabcontent {
      display: none;
      padding: 10px;
      border-top: none;
    }

    iframe {
      width: 100%;
      height: 600px;
      border: 1px solid #ccc;
    }

    .download-link {
      margin-top: 10px;
      display: inline-block;
    }
  </style>
</head>
<body>

  <h2>PDF Viewer with Tabs</h2>

  <div class="tab">
    <button class="tablinks" onclick="openTab(event, 'PDFTab')">Open PDF</button>
  </div>

  <div id="PDFTab" class="tabcontent">
    <iframe src="assets/img/committee/NCVPRIPG2025SCHEDULEWEBSITE.pdf"></iframe>
    <a class="download-link" href="assets/img/committee/NCVPRIPG2025 SCHEDULE WEBSITE.pdf" download>Download PDF</a>
  </div>

  <script>
    function openTab(evt, tabName) {
      const tabcontent = document.getElementsByClassName("tabcontent");
      for (let i = 0; i < tabcontent.length; i++) {
        tabcontent[i].style.display = "none";
      }

      const tablinks = document.getElementsByClassName("tablinks");
      for (let i = 0; i < tablinks.length; i++) {
        tablinks[i].className = tablinks[i].className.replace(" active", "");
      }

      document.getElementById(tabName).style.display = "block";
      evt.currentTarget.className += " active";
    }

    // Optionally open the first tab by default
    document.querySelector(".tablinks").click();
  </script>

</body>
</html>
